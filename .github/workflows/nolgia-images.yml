name: Nolgia agent image

# Nolgia fork only — builds and pushes the Hermes agent runtime image to
# Artifact Registry on every push to main, so agent releases track this
# fork's main branch instead of a hand-built image. Auth is keyless via
# Workload Identity Federation (infra envs/*/wif.tf: gha-public-images SA,
# repo_id_ref binding for this repo's main). That SA can push to the
# `public-builds` repository and nothing else (AC-05, 2026-10-02): this repo is
# public, so its CI must not hold the provisioner-deploy identity or write to
# the `nolgia` repository that holds the proxy, API and provisioner images.
#
# Tags pushed per env:
#   nolgia-<sha10>  — immutable, matches the historical hand-built scheme
#   main            — moving tag the agent-provisioner reconciler tracks
#
# Rollout is NOT done here: the agent-provisioner Cloud Run Job
# (nolgia-agent deploy/provisioner) reconciles releases onto the current
# image on its schedule, respecting its idle-gate and lock.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      env:
        description: Environment to push to
        required: true
        type: choice
        default: stg
        options:
          - stg
          - prod

permissions:
  id-token: write
  contents: read

# Serialize per ref so overlapping pushes don't race tag updates; never
# cancel mid-push or the moving `main` tag could point at a half-pushed
# manifest.
concurrency:
  group: nolgia-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: us-west1
  AR_REPO: public-builds
  IMAGE_NAME: hermes-agent

jobs:
  build-push:
    name: Build & push (${{ matrix.env }})
    # NOL-472: this is OUR workflow (it only runs in the nolgiainc fork) and it
    # builds and pushes the hermes-agent image to nolgia-web-stg/prd Artifact
    # Registry with `push: true`. `push` is main-only via the `on:` block, but
    # `workflow_dispatch` accepts ANY ref, so before this guard a dispatch from
    # a feature branch published that branch's image into a real environment's
    # registry. Same defect that put an unmerged branch on 100% of nolgia-api
    # production traffic on 2026-08-06.
    #
    # Contrast docker.yml in this repo, whose publishing jobs already carry
    # `github.event_name == 'push' && github.ref == 'refs/heads/main' ||
    # github.event_name == 'release'`. This workflow was the one that did not.
    if: github.repository == 'nolgiainc/hermes-agent' && github.ref == 'refs/heads/main'
    # stays hosted: needs docker daemon
    runs-on: ubuntu-latest
    strategy:
      # Envs are independent: prod auth failing must not cancel stg.
      fail-fast: false
      matrix:
        include:
          - env: stg
            project: nolgia-web-stg
          - env: prod
            project: nolgia-web-prd
    # Push events fan out to both envs; manual dispatch targets one.
    steps:
      - name: Skip if not selected env
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.env != matrix.env
        run: echo "skip=1" >> "$GITHUB_ENV"

      - name: Checkout
        if: env.skip != '1'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Authenticate to Google Cloud
        if: env.skip != '1'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ matrix.env == 'stg' && 'projects/198519101960/locations/global/workloadIdentityPools/github-actions/providers/github' || 'projects/725349205404/locations/global/workloadIdentityPools/github-actions/providers/github' }}
          service_account: gha-public-images@${{ matrix.project }}.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        if: env.skip != '1'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        if: env.skip != '1'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Preserve the historical hand-built tag scheme (nolgia-<sha10>) so
      # an exact-SHA pin in infra tfvars keeps working as a rollback path.
      - name: Compute tag
        if: env.skip != '1'
        run: echo "sha_tag=nolgia-${GITHUB_SHA::10}" >> "$GITHUB_ENV"

      # Only the immutable tag is pushed here. The moving `main` tag, which the
      # agent-provisioner reconciler tracks, is promoted below and only after
      # the vulnerability scan passes, so a CRITICAL with a fix never reaches
      # the fleet.
      - name: Build & push agent image
        id: build
        if: env.skip != '1'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/nolgiainc/hermes-agent
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ matrix.project }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ env.sha_tag }}
          # Per-env scopes so the two matrix legs keep independent warm
          # caches instead of racing one scope.
          cache-from: type=gha,scope=nolgia-hermes-${{ matrix.env }}
          cache-to: type=gha,mode=max,scope=nolgia-hermes-${{ matrix.env }}

      # Free container vulnerability gate (Trivy, pinned by digest): fails on a
      # CRITICAL with a fixed version available, reports HIGH to the job
      # summary. Scans the exact digest just pushed. Accepted risks:
      # .trivyignore.yaml (each entry expires within 90 days).
      - name: Scan image for vulnerabilities
        if: env.skip != '1'
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ matrix.project }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: .github/scripts/image-scan.sh "$IMAGE" "hermes-agent (${{ matrix.env }})"

      # Promote the scanned digest to the moving tag. imagetools copies the
      # manifest as is, so `main` resolves to the very digest that was scanned.
      - name: Promote scanned image to the main tag
        if: env.skip != '1'
        env:
          REPO: ${{ env.REGION }}-docker.pkg.dev/${{ matrix.project }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$REPO:main" "$REPO@$DIGEST"
          moved=$(docker buildx imagetools inspect "$REPO:main" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$moved" != "$DIGEST" ]; then
            echo "::error::main resolves to $moved, expected the scanned digest $DIGEST"
            exit 1
          fi
          echo "main -> $REPO@$DIGEST"
